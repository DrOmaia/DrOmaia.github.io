name: Refresh publication metrics

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation counts (Crossref, OpenAlex) and ORCID works, inject into the pages
        run: |
          python3 tools/refresh_metrics.py
          python3 tools/build-arabic.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "metrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json index.html publications.html ar/index.html ar/publications.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh publication metrics (automated weekly update)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild (pushes made with GITHUB_TOKEN do not trigger it by themselves)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the site will refresh on the next manual push"
