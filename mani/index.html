<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mani · تحميل التطبيق</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d1d1d; --mut:#6b6b6b; --ar:#0f766e; --rn:#b45309; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1d22; --card:#2a2d35; --ink:#eceae4; --mut:#9aa0a8; } }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans Arabic",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; }
  .card { max-width:420px; width:100%; background:var(--card); border-radius:20px; padding:28px 20px; }
  h1 { margin:0 0 4px; font-size:30px; }
  .sub { color:var(--mut); margin:0 0 18px; font-size:17px; }
  .pair { display:flex; justify-content:center; gap:10px; margin-bottom:18px; font-size:18px; font-weight:700; }
  .pair span:first-child { color:var(--ar); } .pair span:last-child { color:var(--rn); }
  .btn { display:block; background:var(--ar); color:#fff; text-decoration:none; padding:16px; border-radius:14px; font-size:21px; font-weight:700; }
  .note { color:var(--mut); font-size:14px; line-height:1.7; margin-top:16px; }
</style>
</head>
<body>
<main class="card">
  <h1>Mani</h1>
  <p class="sub">ترجمة عربي ⇄ بروندي على تلفون واحد</p>
  <div class="pair"><span>العربي</span><span>·</span><span>Ikirundi</span></div>
  <a class="btn" href="https://github.com/DrOmaia/Mani/releases/latest/download/Mani.apk">⬇️ تحميل التطبيق (Android)</a>
  <p class="note">
    بعد التحميل افتحي الملف واختاري «تثبيت». إذا طلب إذن «تثبيت من مصادر غير معروفة» وافقي.<br>
    التحديثات بتنزل فوق التطبيق نفسه، وبتعرض التطبيق شريط تحديث لما تطلع نسخة جديدة.
  </p>
</main>
</body>
</html>
